[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayoe"
version = "0.1.0"
description = "Antimatter Yield Optimization Engine alpha"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.scripts]
ayoe = "ayoe.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ayoe = ["presets/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
